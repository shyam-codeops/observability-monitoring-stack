global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "cluster", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "slack-notifications"
  routes:
    - match:
        severity: page
      receiver: "pagerduty-sre"
      continue: true
    - match:
        severity: critical
      receiver: "slack-critical"
    - match:
        severity: warning
      receiver: "slack-warnings"

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance", "service"]

receivers:
  - name: "pagerduty-sre"
    pagerduty_configs:
      - service_key: "pd-sample-integration-key"
        severity: "critical"

  - name: "slack-critical"
    slack_configs:
      - channel: "#alerts-critical"
        api_url: "http://webhook-proxy.internal/slack/critical"
        send_resolved: true
        title: "[CRITICAL] {{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}\nRunbook: {{ .CommonAnnotations.runbook_url }}"

  - name: "slack-warnings"
    slack_configs:
      - channel: "#alerts-warning"
        api_url: "http://webhook-proxy.internal/slack/warning"
        send_resolved: true
        title: "[WARNING] {{ .CommonAnnotations.summary }}"

  - name: "slack-notifications"
    slack_configs:
      - channel: "#devops-general"
        send_resolved: true
